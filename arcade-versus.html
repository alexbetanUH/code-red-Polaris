<style>

  radial-gradient(ellipse 18% 9% at 8% 82%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),

  .height .t { font-size: 13px; color: #2b5a82; } .height .t b { display: block; font-size: 26px; color: #0d3557; }

  .center { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }

  /* Overlay on the board: start, countdown, round and match results */
  .ic { flex: none; vertical-align: -3px; }

  <button class="pill aqua" id="camBtn" disabled>Loading model…</button>

<video id="video" playsinline muted hidden></video>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const $ = (id) => document.getElementById(id);

// ---- Tuning knobs --------------------------------------------------------------
const POINT_MIN = 0.55;       // index finger length / palm size needed to count as "pointing"
const HEIGHT_BOTTOM = 0.85;   // palm y (0 top … 1 bottom) that maps to paddle at the bottom
const HEIGHT_TOP = 0.2;       // … and to the top
const KEY_HOLD = 1.5;         // seconds a key press overrides the hand

// ---- Input: one entry per player, filled by the hand tracker or the keyboard -------
// dir: "u" | "d" | "l" | "r" | null · height: 0 (bottom) … 1 (top)
// tip: index fingertip in board space 0…1 · gesture: "rock" | "paper" | "scissors" | null
const input = { 1: blankInput(), 2: blankInput() };
function blankInput() { return { present: false, dir: null, height: 0.5, tip: null, gesture: null, lm: null, keyAt: -99 }; }

// ---- Hand tracking -----------------------------------------------------------------
const video = $("video");
let landmarker = null, camOn = false, lastVideoTime = -1;

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const options = (delegate) => ({
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.6, minTrackingConfidence: 0.6,
  });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, options("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fileset, options("CPU")); }
}
loadModel().then(() => {
  $("camBtn").disabled = false; $("camBtn").textContent = "Start camera";
}).catch(() => {
  $("camBtn").textContent = "Model failed"; $("status").textContent = "Hand model could not load · keyboard still works";
});

$("camBtn").onclick = async () => {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: "user" }, audio: false });
    await video.play();
    camOn = true; document.body.classList.add("camera-on");
    $("camBtn").textContent = "Camera on"; $("camBtn").classList.replace("aqua", "ghost"); $("camBtn").disabled = true;
  } catch (e) {
    $("status").textContent = "Camera blocked: allow it in the address bar";
  }
};

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function readHand(lm, p) {
  // Mirror x so it matches what the players see (like a selfie).
  const m = lm.map(q => ({ x: 1 - q.x, y: q.y }));
  const palm = dist(m[0], m[9]) || 1e-3;
  // Pointing direction: index knuckle → index tip
  const dx = m[8].x - m[5].x, dy = m[8].y - m[5].y;
  let dir = null;
  if (Math.hypot(dx * 16 / 9, dy) / palm > POINT_MIN) dir = Math.abs(dx * 16 / 9) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u");
  // Height of the palm center
  const height = Math.min(1, Math.max(0, (HEIGHT_BOTTOM - m[9].y) / (HEIGHT_BOTTOM - HEIGHT_TOP)));
  // Fingertip mapped from this player's half of the frame to the whole board
  const hx = p === 1 ? m[8].x / 0.5 : (m[8].x - 0.5) / 0.5;
  const tip = { x: Math.min(1, Math.max(0, (hx - 0.08) / 0.84)), y: Math.min(1, Math.max(0, (m[8].y - 0.1) / 0.8)) };
  // Gesture: which fingers are extended (tip farther from the wrist than the middle joint)
  const ext = [[8, 6], [12, 10], [16, 14], [20, 18]].map(([t, j]) => dist(m[t], m[0]) > dist(m[j], m[0]) * 1.1);
  const n = ext.filter(Boolean).length;
  let gesture = null;
  if (n === 0) gesture = "rock";
  else if (n >= 4) gesture = "paper";
  else if (ext[0] && ext[1] && !ext[2] && !ext[3]) gesture = "scissors";
  return { dir, height, tip, gesture, lm: m };
}

function track(now) {
  if (!camOn || !landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, now);
  const seen = { 1: null, 2: null };
  for (const lm of res.landmarks) {
    const p = 1 - lm[0].x < 0.5 ? 1 : 2;   // wrist on the left half of the mirrored frame = P1
    if (!seen[p]) seen[p] = lm;
  }
  for (const p of [1, 2]) {
    const inp = input[p];
    inp.present = !!seen[p];
    inp.lm = null;
    if (!seen[p]) { if (clock - inp.keyAt >= KEY_HOLD) { inp.tip = null; inp.gesture = null; } continue; }
    const h = readHand(seen[p], p);
    inp.lm = h.lm;
    if (clock - inp.keyAt < KEY_HOLD) continue;   // keyboard has priority for a moment
    inp.height = inp.height * 0.6 + h.height * 0.4;
    inp.tip = h.tip;
    if (h.dir) inp.dir = h.dir;
    inp.gesture = h.gesture;
  }
}

// ---- Keyboard fallback -----------------------------------------------------------
const KEYS = {
  w: [1, "u"], s: [1, "d"], a: [1, "l"], d: [1, "r"],
  arrowup: [2, "u"], arrowdown: [2, "d"], arrowleft: [2, "l"], arrowright: [2, "r"],
  1: [1, "rock"], 2: [1, "paper"], 3: [1, "scissors"], 8: [2, "rock"], 9: [2, "paper"], 0: [2, "scissors"],
};
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); overlayAction(); return; }
  const m = KEYS[k]; if (!m) return;
  e.preventDefault();
  const [p, v] = m, inp = input[p];

// ---- Little sounds -----------------------------------------------------------------
let actx = null;
function beep(freq, dur = 0.08, type = "triangle", vol = 0.15) {
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

// ---- Background song --------------------------------------------------------------
// "Sky Arcade": a short original chiptune made with Web Audio (no audio files, no rights
// issues). 4 chords (F G Em Am) at 128 BPM: kick, hi-hat, bass, arpeggio and a lead that
// joins every other loop. It starts with the first Start click (browsers block autoplay).
const music = {
  on: true, playing: false, bpm: 128, step: 0, next: 0, timer: null, out: null,
  CHORDS: [[53, 57, 60], [55, 59, 62], [52, 55, 59], [57, 60, 64]],
  LEAD: [
    77, 0, 76, 0, 72, 0, 69, 0, 72, 0, 74, 0, 76, 0, 0, 0,
    74, 0, 72, 0, 71, 0, 67, 0, 71, 0, 72, 0, 74, 0, 0, 0,
    76, 0, 79, 0, 76, 0, 71, 0, 74, 0, 76, 0, 79, 0, 0, 0,
    81, 0, 79, 0, 76, 0, 72, 0, 76, 0, 74, 0, 72, 0, 0, 0,
  ],
  start() {
    if (!this.on || this.playing) return;
    actx = actx || new AudioContext();
    actx.resume();
    if (!this.out) {
      this.out = actx.createGain(); this.out.gain.value = 0.22; this.out.connect(actx.destination);
      const n = actx.createBuffer(1, actx.sampleRate * 0.2, actx.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = n;
    }
    this.playing = true; this.next = actx.currentTime + 0.05;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stop() { this.playing = false; clearInterval(this.timer); },
  hz: (m) => 440 * 2 ** ((m - 69) / 12),
  tone(t, freq, dur, type, vol, slideTo) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.02);
  },
  hat(t) {
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = this.noise; f.type = "highpass"; f.frequency.value = 7000;
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(f).connect(g).connect(this.out); src.start(t); src.stop(t + 0.06);
  },
  schedule() {
    const s16 = 60 / this.bpm / 4;
    while (this.next < actx.currentTime + 0.12) {
      const t = this.next, k = this.step % 16, bar = Math.floor(this.step / 16) % 4, loop = Math.floor(this.step / 64);
      const ch = this.CHORDS[bar];
      if (k % 4 === 0) this.tone(t, 150, 0.14, "sine", 0.9, 45);                       // kick
      if (k % 4 === 2) this.hat(t);                                                     // hi-hat
      if ([0, 3, 6, 8, 11, 14].includes(k)) this.tone(t, this.hz(ch[0] - 12 + (k === 6 || k === 14 ? 7 : 0)), s16 * 1.6, "triangle", 0.35);
      this.tone(t, this.hz(ch[[0, 1, 2, 1][k % 4]] + 12), s16 * 0.9, "square", 0.035);  // arpeggio
      const m = this.LEAD[this.step % 64];
      if (loop % 2 === 1 && m) { this.tone(t, this.hz(m), s16 * 1.8, "square", 0.05); this.tone(t, this.hz(m + 12), s16 * 1.2, "triangle", 0.04); }
      this.step++; this.next += s16;
    }
  },
};

// ---- Bubble bursts: crashes, points, pops and the winner's bubble rain -----------------
let FX = [];
function burst(x, y, color, n = 14, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), v = rand(.3, 1) * H * .35 * power;
    FX.push({ kind: "b", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(.008, .022) * H * power, t: rand(.5, .9), T: 0, color });
  }
  FX.push({ kind: "ring", x, y, r: H * .02 * power, t: .6, T: 0, color });
  FX.push({ kind: "ring", x, y, r: H * .005, t: .8, T: -.1, color });
}
function rain(color) {
  FX.push({ kind: "b", x: rand(0, W), y: -H * .05, vx: rand(-20, 20), vy: H * rand(.15, .35), r: rand(.012, .03) * H, t: 4, T: 0, color, float: true });
}
function drawFX(dt) {
  for (const f of FX) {
    f.T += dt;
    if (f.T < 0) continue;
    const k = Math.min(1, f.T / f.t);
    if (f.kind === "b") {
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (!f.float) { f.vx *= .94; f.vy = f.vy * .94 - H * .02 * dt; }
      g.globalAlpha = f.float ? 1 : 1 - k; bubble(f.x, f.y, f.r * (f.float ? 1 : 1 - .3 * k), f.color);
    } else {
      g.globalAlpha = 1 - k; g.strokeStyle = f.color; g.lineWidth = 6 * (1 - k) + 1;
      g.beginPath(); g.arc(f.x, f.y, f.r + k * H * .12, 0, 6.28); g.stroke();
    }
  }
  g.globalAlpha = 1;
  FX = FX.filter(f => f.T < f.t && f.y < H * 1.1);
}

const AQUA = ["#9be0ff", "#1e95e3", "#0a6bc0"], LIME = ["#dcfbbd", "#86d44e", "#4f9f24"], WHITE = ["#ffffff", "#eef6fc", "#d8e9f6"];

function block(x, y, s, [a, b, c], alpha = 1) {

  g.fillStyle = gr; g.beginPath(); g.roundRect(x + 2, y + 2, s - 4, s - 4, s * .25); g.fill();

}

  const gr = g.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r);
  gr.addColorStop(0, "rgba(255,255,255,.95)"); gr.addColorStop(.4, tint + "66"); gr.addColorStop(.92, tint + "dd"); gr.addColorStop(1, "#ffffff");

function apple(cx, cy, r) {

function eyes(x, y, s, dir) {

// Grid board: returns cell size and offsets so the grid is centered in the canvas
function gridBoard(cols, rows) {
  const s = Math.min(W / cols, H / rows), ox = (W - s * cols) / 2, oy = (H - s * rows) / 2;
  g.fillStyle = "#e6f3fc"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#f4fbff"; g.fillRect(ox, oy, s * cols, s * rows);
  g.fillStyle = "rgba(190,225,248,.45)";
  for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++) if ((x + y) % 2) g.fillRect(ox + x * s, oy + y * s, s, s);

}
function openBoard() {
  g.fillStyle = "#f4fbff"; g.fillRect(0, 0, W, H);
  const s = H / 16;
  g.fillStyle = "rgba(190,225,248,.45)";
  for (let x = 0; x * s < W; x++) for (let y = 0; y < 16; y++) if ((x + y) % 2) g.fillRect(x * s, y * s, s, s);

const VEC = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
const OPP = { u: "d", d: "u", l: "r", r: "l" };
const rand = (a, b) => a + Math.random() * (b - a);

// ---- Games ---------------------------------------------------------------------------
// Each game: meta for the UI, init(), update(dt) while playing, draw(), and side-panel info.
// Snake Battle and Bubble Trails move freely (no grid): the head turns toward the player's
// index fingertip. Positions are in board units: y 0…1 (top→bottom), x 0…aspect.
const aspect = () => W / H || 1.6;
const ANG = { u: -Math.PI / 2, d: Math.PI / 2, l: Math.PI, r: 0 };
function steer(h, p, dt, rate) {
  const inp = input[p];
  let want = null;
  if (clock - inp.keyAt < KEY_HOLD && inp.dir) want = ANG[inp.dir];
  else if (inp.tip) {
    const dx = inp.tip.x * aspect() - h.x, dy = inp.tip.y - h.y;
    if (Math.hypot(dx, dy) > 0.03) want = Math.atan2(dy, dx);
  }
  if (want === null) return;
  const d = Math.atan2(Math.sin(want - h.a), Math.cos(want - h.a));
  h.a += Math.max(-rate * dt, Math.min(rate * dt, d));
}
function advance(h, dt, speed) {
  h.x += Math.cos(h.a) * speed * dt; h.y += Math.sin(h.a) * speed * dt;
  const last = h.pts[h.pts.length - 1];
  if (!last || Math.hypot(h.x - last.x, h.y - last.y) >= 0.01) h.pts.push({ x: h.x, y: h.y });
}
const outside = (h, m = 0.015) => h.x < m || h.y < m || h.x > aspect() - m || h.y > 1 - m;
// Glossy tube along a path, like the landing's buttons: dark rim, color, white highlight.
const TUBE = { 1: ["#0a6bc0", "#2aa3ef"], 2: ["#3f8f17", "#74cc3c"] };
function tube(pts, p, width, alpha = 1) {
  if (pts.length < 2) return;
  g.globalAlpha = alpha; g.lineJoin = g.lineCap = "round";
  const path = (oy = 0) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q.x * H, q.y * H + oy) : g.moveTo(q.x * H, q.y * H + oy)); };
  path(); g.strokeStyle = TUBE[p][0]; g.lineWidth = width * 1.18; g.stroke();
  path(); g.strokeStyle = TUBE[p][1]; g.lineWidth = width; g.stroke();

  g.globalAlpha = 1;
}
function head(h, p, r, alpha = 1) {
  g.globalAlpha = alpha;
  const x = h.x * H, y = h.y * H;
  const gr = g.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r);
  gr.addColorStop(0, "#fff"); gr.addColorStop(.35, TUBE[p][1]); gr.addColorStop(1, TUBE[p][0]);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.28); g.fill();
  const ca = Math.cos(h.a), sa = Math.sin(h.a);

    const ex = x + ca * r * .35 - sa * k * r * .42, ey = y + sa * r * .35 + ca * k * r * .42;
    g.fillStyle = "#fff"; g.beginPath(); g.arc(ex, ey, r * .3, 0, 6.28); g.fill();
    g.fillStyle = "#0b2f52"; g.beginPath(); g.arc(ex + ca * r * .1, ey + sa * r * .1, r * .15, 0, 6.28); g.fill();

}

function drawTips(alpha) {

    const t = input[p].tip; if (!t || clock - input[p].keyAt < KEY_HOLD) continue;
    g.strokeStyle = PCOL[p]; g.lineWidth = 6; g.beginPath(); g.arc(t.x * W, t.y * H, H * .03, 0, 6.28); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(t.x * W, t.y * H, H * .011, 0, 6.28); g.fill(); g.stroke();
    g.fillStyle = PCOL[p]; g.font = `900 ${H * .025}px Nunito`; g.fillText("P" + p, t.x * W, t.y * H - H * .045);
  }

}
function startPos(p) {
  return p === 1 ? { x: aspect() * .15, y: .72, a: 0, pts: [] } : { x: aspect() * .85, y: .28, a: Math.PI, pts: [] };
}

const snake = {
  id: "snake", icon: "apple", orb: "p2", name: "Snake Battle", unit: "APPLES", rule: "Most apples wins the round",
  help: "Your snake <b>follows your index finger</b>. Eat apples to grow. <b>Hit a wall or the other snake and you lose half your tail.</b> 2 rounds of 20 seconds: most rounds wins, and if it ends 1–1, most apples in total.",
  rounds: 2, roundTime: 20, speed: 0.3, turn: 4.2, base: 0.3, perApple: 0.05,
  init() {
    this.s = { 1: this.spawn(1, 0), 2: this.spawn(2, 0) };
    this.apples = []; for (let i = 0; i < 4; i++) this.addApple();
  },
  spawn(p, eaten) { return Object.assign(startPos(p), { eaten, safe: 1 }); },
  len(sn) { return this.base + sn.eaten * this.perApple; },
  addApple() {
    this.apples.push({ x: rand(.08, aspect() - .08), y: rand(.08, .92) });
  },
  trim(sn) {   // keep only the last `len` of the path
    let d = 0;
    for (let i = sn.pts.length - 1; i > 0; i--) {
      d += Math.hypot(sn.pts[i].x - sn.pts[i - 1].x, sn.pts[i].y - sn.pts[i - 1].y);
      if (d > this.len(sn)) { sn.pts.splice(0, i - 1); return; }

  update(dt) {
    for (const p of [1, 2]) {
      const sn = this.s[p];

      const ai = this.apples.findIndex(a => Math.hypot(a.x - sn.x, a.y - sn.y) < 0.045);
      if (ai >= 0) { burst(this.apples[ai].x * H, this.apples[ai].y * H, "#ff5a4a", 7, .5); this.apples.splice(ai, 1); this.addApple(); sn.eaten++; state.score[p]++; beep(p === 1 ? 660 : 520); }
    }

  widget: "pointer",

const trails = {
  id: "trails", icon: "bubbles", orb: "p1", name: "Bubble Trails", unit: "POINTS", rule: "Hit a wall or a trail and you lose the round",
  help: "Your bubble <b>follows your index finger</b> and leaves a trail that stays. <b>Hit a wall or any trail and the other player scores.</b> First to 3 wins.",
  target: 3, speed: 0.25, turn: 4.5,
  init() { this.t = { 1: startPos(1), 2: startPos(2) }; this.over = 0; this.age = 0; },
  update(dt) {
    if (this.over > 0) { this.over -= dt; if (this.over <= 0) this.init(); return; }
    this.age += dt;
    for (const p of [1, 2]) { const h = this.t[p]; steer(h, p, dt, this.turn); advance(h, dt, this.speed); }
    const dead = {};
    for (const p of [1, 2]) {
      const h = this.t[p];
      dead[p] = outside(h) || [1, 2].some(q => {
        const pts = this.t[q].pts, end = q === p ? pts.length - 8 : pts.length;   // skip your own newest bit

function handPhoto(p) {
  const lm = input[p].lm;

  const vw = video.videoWidth, vh = video.videoHeight;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;

  const cg = c.getContext("2d");
  cg.translate(320, 0); cg.scale(-1, 1);   // lm is mirrored, so the raw frame center is vw - cx
  cg.drawImage(video, vw - cx - size / 2, cy - size / 2, size, size, 0, 0, 320, 320);

const GAMES = [snake, trails, pong, pop, duel];

// ---- Match flow: idle → countdown → playing → (round over) → match over ----------------
let clock = 0, paused = false;
const state = { game: snake, phase: "idle", score: { 1: 0, 2: 0 }, rounds: { 1: 0, 2: 0 }, round: 1, timeLeft: 0, count: 0, winner: 0 };

function selectGame(i) {
  FX = [];
  state.game = GAMES[(i + GAMES.length) % GAMES.length];
  history.replaceState(null, "", "#" + state.game.id);
  resetMatch();
}
function resetMatch() {
  Object.assign(state, { phase: "idle", score: { 1: 0, 2: 0 }, rounds: { 1: 0, 2: 0 }, totals: { 1: 0, 2: 0 }, round: 1, winner: 0 });
  state.game.best = 0; state.game.draws = 0;
  state.game.init(); state.timeLeft = state.game.roundTime || 0;
  buildSides(); showOverlay();
}
function startRound() {
  music.start();
  state.score = { 1: 0, 2: 0 }; state.game.init(); state.timeLeft = state.game.roundTime || 0;
  state.phase = "countdown"; state.count = 3; beep(440);
  showOverlay();
}
function endRound() {
  const s = state.score, w = s[1] > s[2] ? 1 : s[2] > s[1] ? 2 : 0;
  if (w) state.rounds[w]++;
  state.totals[1] += s[1]; state.totals[2] += s[2];
  const need = Math.floor(state.game.rounds / 2) + 1;   // 2 rounds → play both; 3 rounds → best of 3
  if (state.rounds[1] >= need || state.rounds[2] >= need || state.round >= state.game.rounds) {
    const r = state.rounds, tt = state.totals;
    state.winner = r[1] !== r[2] ? (r[1] > r[2] ? 1 : 2) : tt[1] !== tt[2] ? (tt[1] > tt[2] ? 1 : 2) : 0;   // tied rounds → total points
    state.phase = "matchover";
  } else { state.phase = "roundover"; state.roundWinner = w; state.round++; }
  beep(w ? 880 : 300, 0.4); showOverlay();
}
function endMatch() {
  state.winner = state.score[1] > state.score[2] ? 1 : 2;
  state.phase = "matchover"; beep(990, 0.5); showOverlay();
}
function overlayAction() {
  if (state.phase === "idle" || state.phase === "roundover") startRound();
  else if (state.phase === "matchover") { resetMatch(); startRound(); }
}

function showOverlay() {
  const o = $("overlay"), gm = state.game;
  o.hidden = state.phase === "playing";
  if (state.phase === "idle") o.innerHTML = `<div>${orb(gm, 76)}<h2>${gm.name}</h2><p>${gm.help}</p>
    <button class="pill lime" id="go">${ic("play", 18, 2.6)} Start</button>
    <div class="keys">No camera? P1 uses <b>W A S D</b> (and 1 2 3), P2 uses the <b>arrows</b> (and 8 9 0). Space = start.</div></div>`;
  else if (state.phase === "countdown") o.innerHTML = `<div><div class="count">${state.count}</div><p>P1 on the left · P2 on the right</p></div>`;
  else if (state.phase === "roundover") o.innerHTML = `<div><h2>${state.roundWinner ? `Player ${state.roundWinner} takes the round!` : "Round tied!"}</h2>
    <p>Rounds · P1 <b>${state.rounds[1]}</b> – <b>${state.rounds[2]}</b> P2</p><button class="pill lime" id="go">Next round</button></div>`;
  else if (state.phase === "matchover") o.innerHTML = `<div>${state.winner ? `<span class="orb p${state.winner} gorb" style="width:76px;height:76px;font-size:26px">P${state.winner}</span>` : ""}<h2>${state.winner ? `Player ${state.winner} wins!` : "It's a tie!"}</h2>
    <p>${gm.rounds ? `Rounds · P1 <b>${state.rounds[1]}</b> – <b>${state.rounds[2]}</b> P2${state.rounds[1] === state.rounds[2] ? `<br>Total ${gm.unit.toLowerCase()} · P1 <b>${state.totals[1]}</b> – <b>${state.totals[2]}</b> P2` : ""}` : `Final score · P1 <b>${state.score[1]}</b> – <b>${state.score[2]}</b> P2`}</p>
    <button class="pill lime" id="go">Play again</button></div>`;
  const go = $("go"); if (go) go.onclick = overlayAction;
  updateTitle();
}
function updateTitle() {
  const gm = state.game, i = GAMES.indexOf(gm);
  const sub = gm.rounds ? `Round ${state.round} of ${gm.rounds}` : `First to ${gm.target}`;
  $("title").innerHTML = `${orb(gm, 30)}<b>${gm.name}</b> <i>· ${sub}</i>`;

// ---- Camera panels: each player's half of the mirrored frame, with their hand drawn on top --
const BONES = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];

      const vw = video.videoWidth, vh = video.videoHeight, half = vw / 2;
      const sh = Math.min(vh, half * ch / cw), sy = (vh - sh) / 2;

      if (lm) {
        const X = (q) => ((p === 1 ? q.x : q.x - 0.5) / 0.5) * cw, Y = (q) => (q.y * vh - sy) / sh * ch;
        cg.strokeStyle = PCOL[p]; cg.lineWidth = 3; cg.lineCap = "round";

        cg.fillStyle = "#fff"; cg.beginPath(); cg.arc(X(lm[8]), Y(lm[8]), 5, 0, 6.28); cg.fill(); cg.stroke();
      }
    } else {
      cg.fillStyle = "#8fb6d2"; cg.fillRect(0, 0, cw, ch);
      cg.fillStyle = p === 1 ? "rgba(30,149,227,.15)" : "rgba(111,207,58,.15)"; cg.fillRect(0, 0, cw, ch);
      cg.fillStyle = "#5d86a6"; cg.beginPath(); cg.arc(cw * .55, ch * .45, 32, 0, 6.28); cg.fill();
      cg.beginPath(); cg.ellipse(cw * .55, ch * 1.15, 80, 90, 0, 0, 6.28); cg.fill();
      cg.fillStyle = "#fff"; cg.font = "800 15px Nunito"; cg.textAlign = "center"; cg.fillText("Start the camera to play", cw / 2, ch - 14);
    }
  }
}

// ---- Main loop ---------------------------------------------------------------------------
let last = performance.now();
const schedule = requestAnimationFrame;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  track(now);
  if (!paused) {
    clock += dt;
    if (state.phase === "countdown") {
      const before = Math.ceil(state.count); state.count -= dt;
      if (state.count <= 0) { state.phase = "playing"; beep(880, 0.15); showOverlay(); }
      else if (Math.ceil(state.count) !== before) { beep(440); $("overlay").querySelector(".count").textContent = Math.ceil(state.count); }
    } else if (state.phase === "playing") {
      state.game.update(dt);
      if (state.game.roundTime && state.phase === "playing") { state.timeLeft -= dt; if (state.timeLeft <= 0) { state.timeLeft = 0; endRound(); } }
    }
  }
  state.game.draw();
  if (state.phase === "matchover" && state.winner && Math.random() < .35) rain(PCOL[state.winner]);
  drawFX(paused ? 0 : dt);
  drawCams();
  updateSides();
  schedule(loop);
}

$("prev").onclick = () => selectGame(GAMES.indexOf(state.game) - 1);
$("next").onclick = () => selectGame(GAMES.indexOf(state.game) + 1);
$("restartBtn").onclick = () => resetMatch();
const pauseLabel = () => { $("pauseBtn").innerHTML = paused ? `${ic("play", 16, 2.6)} Resume` : `${ic("pause", 16, 2.6)} Pause`; };
$("pauseBtn").onclick = () => { paused = !paused; pauseLabel(); if (paused) music.stop(); else music.start(); };
const musicLabel = () => {
  $("musicBtn").innerHTML = music.on ? `${ic("music", 16, 2.4)} Music on` : `${ic("mute", 16, 2.4)} Music off`;
  $("musicBtn").setAttribute("aria-pressed", music.on);
};
$("musicBtn").onclick = () => { music.on = !music.on; if (music.on) music.start(); else music.stop(); musicLabel(); };
musicLabel();
pauseLabel();
for (const el of document.querySelectorAll("[data-ic]")) el.insertAdjacentHTML("afterbegin", ic(el.dataset.ic, 18, 2.6));
addEventListener("resize", fit);

fit();
selectGame(Math.max(0, GAMES.findIndex(gm => gm.id === location.hash.slice(1))));
document.fonts.ready.then(fit);
schedule(loop);

</script>
</body>
