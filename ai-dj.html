<html lang="en">
<head>

<title>AirDeck · AirMix</title>

<style>
  /* AirMix page (the DJ-set rhythm game): the shared Aero look (aero.css) in the sunset world.
     Card styles adapted from Carlos's white-glass version of this page (club.html).
     queue.js reads --panel, --border, --bg, --text, --muted, --left, --between. */
  :root {
    --text: #3a2412;
    --muted: #7a4a26;
    --left: #1e95e3;
    --right: #5cb82c;
    --between: #f5861f;
    --panel: #fffaf3;
    --border: rgba(232,160,100,.5);
    --bg: rgba(255,255,255,.92);
  }
  body { color: var(--text); }
  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    align-items: start;
    gap: 20px;
    padding: 18px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage {
    position: relative;
    border-radius: 26px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    max-height: calc(100vh - 120px);
    background: rgba(255,255,255,.2);
    border: 2px solid rgba(255,255,255,.95);
    box-shadow: 0 14px 38px rgba(150,70,20,.2), inset 0 0 0 1px rgba(232,160,100,.35);
  }
  video { display: none; }
  canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #3a2412;
    font-size: 18px;
    font-weight: 800;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
    background: radial-gradient(ellipse 40% 18% at 50% 50%, rgba(255,255,255,.75), rgba(255,255,255,0));
  }
  aside, #cards { display: flex; flex-direction: column; gap: 12px; }
  #cards[hidden] { display: none; }
  .card { position: relative; border-radius: 22px; padding: 14px 16px; }
  .card h2 {
    display: flex;
    justify-content: space-between;
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #b0550a;
  }
  .pose { color: var(--text); text-transform: none; letter-spacing: 0; }
  .row { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .row .label { color: var(--muted); }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: rgba(232,160,100,.25); border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(150,70,20,.2); }
  .bar > div { height: 100%; width: 0; border-radius: 4px; }
  .left .bar > div, .left .dot.on { background: linear-gradient(180deg, #63cdfc, #1e95e3 50%, #0a6bc0 51%, #1d8fe0); }
  .right .bar > div, .right .dot.on { background: linear-gradient(180deg, #d4f8ad, #8fda55 50%, #62b92e 51%, #86d44e); }
  .between .bar > div { background: linear-gradient(180deg, #ffe2c2, #ffab60 50%, #f5861f 51%, #ffa24f); }
  .left h2 .side { color: var(--left); }
  .right h2 .side { color: var(--right); }
  .between h2 .side { color: var(--between); }
  .fingers { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: rgba(232,160,100,.25); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 11px; }
  .dot:not(.on) { color: var(--muted); }
  .control { font: 900 30px/1.1 'Nunito', sans-serif; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .left .control { color: #0a6bc0; }
  .right .control { color: #3f8f17; }
  .between .control { color: #c35f08; }
  #songStatus { font-size: 12px; color: var(--muted); margin-top: 8px; overflow-wrap: anywhere; }
  #songStatus.error { color: #b3261e; }
  .song .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .song input[type="file"] { display: none; }
  .muted { color: var(--muted); }
  .help { color: var(--muted); font-size: 13px; margin: 0; padding: 12px 14px; border-radius: 18px; }
  .help b { color: var(--text); }
</style>

<main>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
import { Deck } from "./aiDeck.js";
import { createQueue } from "./queue.js";
import { createDjGame } from "./djGame.js";
import { createStartScreen } from "./djStart.js";

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

// ---- Tuning knobs -------------------------------------------------------
// Pinch raw = closest gap between the last finger segments of thumb and index
// (not just the tip points), divided by palm size. Measured on the 2D image
// landmarks in pixels, which are more precise than MediaPipe's 3D "world" ones.
// Defaults; "Calibrate pinch" measures your own and saves them.
let PINCH_CLOSED = 0.05;     // raw at/below this → 0
let PINCH_OPEN = 0.9;        // raw at/above this → 1
const PINCH_ON = 0.06;       // pinched when value drops below this…
const PINCH_OFF = 0.15;      // …and released only once it rises above this
// Pinch stabilization, applied in this order:
const PINCH_MEDIAN_FRAMES = 5;                     // 1. median of last N frames kills tracking spikes
const PINCH_FILTER = { minCutoff: 0.6, beta: 3 };  // 2. One Euro, steadier than other values
const DEADBAND = 0.03;                             // 3. ignore wobble smaller than this
const END_SNAP = 0.06;                             // 4. within this of 0 or 1 → snap to 0 or 1
// Openness raw = average fingertip-to-wrist distance / palm size.
const OPEN_FIST = 1.0;
const OPEN_FLAT = 1.8;
// Height: palm center, vertical range of the frame that maps to 0–1.
const HEIGHT_BOTTOM = 0.85;
const HEIGHT_TOP = 0.15;
// Between raw = gap between pinch midpoints as a share of frame width.
const BETWEEN_CLOSED = 0.04;
const BETWEEN_OPEN = 0.8;
// A finger counts as extended when its joints bend less than this (degrees, summed).
const FINGER_STRAIGHT_DEG = 70;
const POSE_STABLE_FRAMES = 4; // pose must hold this many frames before it changes
// Smoothing (One Euro filter): lower minCutoff = smoother when still,
// higher beta = less lag when moving fast.
const POINT_FILTER = { minCutoff: 1.5, beta: 8 };   // landmark positions (0–1 units)
const VALUE_FILTER = { minCutoff: 1.0, beta: 4 };   // the 0–1 output values
const HOLD_MS = 250;         // keep a lost hand on screen this long before dropping it
// Hand → audio mapping (all inputs are 0–1)
const SPEED_MIN = 0.9, SPEED_MAX = 1.1;     // left pinch → playback speed (±10%, like a CDJ/Traktor pitch fader)
const FREQ_MIN = 150, FREQ_MAX = 10000;     // right pinch → low-pass cutoff (Hz, exponential); little audible above 10 kHz
const FREQ_OFF = 20000;                     // fully open pinch (snapped to 1) = filter off
const SPEED_DETENT = 0.01;                  // speeds within ±this of 1.0× snap to exactly 1.0×
const WAVE_AMPLITUDE = 140;                 // px height of the waveform between hands
// -------------------------------------------------------------------------

// Landmark indices (MediaPipe hand model)
const WRIST = 0, THUMB_TIP = 4, INDEX_MCP = 5, INDEX_TIP = 8, MIDDLE_MCP = 9;
const PALM = [0, 5, 9, 13, 17];
// [MCP, PIP, DIP, TIP] for each non-thumb finger
const FINGERS = { index: [5, 6, 7, 8], middle: [9, 10, 11, 12], ring: [13, 14, 15, 16], pinky: [17, 18, 19, 20] };
const FINGER_NAMES = ["index", "middle", "ring", "pinky"];

const CONNECTIONS = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [17, 18], [18, 19], [19, 20],
  [0, 17],
];

const COLORS = { left: "#1e95e3", right: "#5cb82c", between: "#f5861f" };

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("start");
const calibBtn = document.getElementById("calibrate");
const statusEl = document.getElementById("status");
const calibMsg = document.getElementById("calibMsg");
const $ = (id) => document.getElementById(id);

let landmarker;
let lastVideoTime = -1;
const deck = new Deck();
const controls = { speed: 1, freq: FREQ_OFF, volume: 0.8 };
// Each hand's control as a 0–1 knob: left = speed (0.5 = 1.0×), right = filter (1 = open)
const knobs = { left: 0.5, right: 1 };
let frames = 0, fpsTime = performance.now();

// Restore saved calibration
try {
  const saved = JSON.parse(localStorage.getItem("airdeck-pinch-v2") || "null");
  if (saved && saved.closed < saved.open) ({ closed: PINCH_CLOSED, open: PINCH_OPEN } = saved);
} catch {}

// ---- Panel ---------------------------------------------------------------
const row = (id, label) =>
  `<div class="row"><span class="label">${label}</span><div class="bar"><div id="${id}Bar"></div></div><span class="num" id="${id}Val">–</span></div>`;
const CONTROL_NAMES = { left: "speed", right: "filter" };
$("cards").innerHTML = ["left", "right"].map((side) => `
  <div class="card glass ${side}">
    <h2><span><span class="side">●</span> ${side} hand · ${CONTROL_NAMES[side]}</span><span class="pose" id="${side}Pose">not detected</span></h2>
    <div class="control" id="${side}Control">–</div>
    ${row(side + "Pinch", "Pinch")}
    ${row(side + "Height", "Height")}
    ${row(side + "Open", "Open")}
    <div class="fingers">
      ${["T", "I", "M", "R", "P"].map((f, i) => `<div class="dot" id="${side}F${i}">${f}</div>`).join("")}    </div>
  </div>`).join("");

// ---- One Euro filter -------------------------------------------------------
// Smooths heavily when the signal is steady, follows quickly when it moves fast.
// https://gery.casiez.net/1euro/
class OneEuro {
  constructor({ minCutoff, beta, dCutoff = 1 }) {
    Object.assign(this, { minCutoff, beta, dCutoff });
    this.reset();
  }
  reset() { this.x = null; this.dx = 0; this.t = null; }
  alpha(cutoff, dt) { return 1 / (1 + 1 / (2 * Math.PI * cutoff * dt)); }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max((t - this.t) / 1000, 1e-3);
    const ad = this.alpha(this.dCutoff, dt);
    this.dx = ad * ((x - this.x) / dt) + (1 - ad) * this.dx;
    const a = this.alpha(this.minCutoff + this.beta * Math.abs(this.dx), dt);
    this.x = a * x + (1 - a) * this.x;
    this.t = t;
    return this.x;
  }
}

// Per-side state, so filters follow the same physical hand between frames.
function makeSide() {
  return {
    points: Array.from({ length: 21 }, () => ({ x: new OneEuro(POINT_FILTER), y: new OneEuro(POINT_FILTER) })),
    pinch: new OneEuro(PINCH_FILTER),
    pinchRecent: [],        // last few raw pinch readings, for the median
    height: new OneEuro(VALUE_FILTER),
    open: new OneEuro(VALUE_FILTER),
    pinched: false,
    pose: "—", poseCandidate: "—", poseFrames: 0,
    lastSeen: -Infinity,
    hand: null,
  };
}
const sides = { left: makeSide(), right: makeSide() };
const betweenFilter = new OneEuro(VALUE_FILTER);

function resetSide(s) {
  s.points.forEach((p) => { p.x.reset(); p.y.reset(); });
  for (const f of [s.pinch, s.height, s.open]) f.reset();
  s.pinchRecent = [];
  s.pinched = false;
  s.pose = s.poseCandidate = "—";
  s.poseFrames = 0;
  s.hand = null;
}

// ---- Setup ---------------------------------------------------------------
async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const options = (delegate) => ({
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.6,
    minHandPresenceConfidence: 0.6,
    minTrackingConfidence: 0.6,
  });
  try {
    landmarker = await HandLandmarker.createFromOptions(fileset, options("GPU"));
  } catch {
    landmarker = await HandLandmarker.createFromOptions(fileset, options("CPU"));
  }
}

async function startCamera() {
  startBtn.disabled = true;
  statusEl.textContent = "Requesting camera…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: "user" },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    $("placeholder").remove();
    startBtn.textContent = "Camera on";
    calibBtn.disabled = false;
    scheduleFrame();
    return true;
  } catch (err) {
    statusEl.textContent = "Camera error: " + err.message;
    startBtn.disabled = false;
    return false;
  }
}

// Run detection once per new camera frame (not once per screen refresh).
function scheduleFrame() {
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onFrame);
  else requestAnimationFrame(onFrame);
}

function onFrame() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    update(landmarker.detectForVideo(video, now), now);
    updateFps(now);
  }
  scheduleFrame();
}

// ---- Math helpers ----------------------------------------------------------
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const remap = (v, lo, hi) => clamp01((v - lo) / (hi - lo));
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const dot3 = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;

// Shortest distance between 3D line segments p1–q1 and p2–q2
// (standard closest-points method, e.g. Ericson, "Real-Time Collision Detection").
function segmentDistance(p1, q1, p2, q2) {
  const d1 = sub3(q1, p1), d2 = sub3(q2, p2), r = sub3(p1, p2);
  const a = dot3(d1, d1), e = dot3(d2, d2), f = dot3(d2, r);
  let s, t;
  if (a < 1e-9 && e < 1e-9) return dist3(p1, p2);
  if (a < 1e-9) { s = 0; t = clamp01(f / e); }
  else {
    const c = dot3(d1, r);
    if (e < 1e-9) { t = 0; s = clamp01(-c / a); }
    else {
      const b = dot3(d1, d2), denom = a * e - b * b;
      s = denom > 1e-9 ? clamp01((b * f - c * e) / denom) : 0;
      t = (b * s + f) / e;
      if (t < 0) { t = 0; s = clamp01(-c / a); }
      else if (t > 1) { t = 1; s = clamp01((b - c) / a); }
    }
  }
  const c1 = { x: p1.x + d1.x * s, y: p1.y + d1.y * s, z: p1.z + d1.z * s };
  const c2 = { x: p2.x + d2.x * t, y: p2.y + d2.y * t, z: p2.z + d2.z * t };
  return dist3(c1, c2);
}

// Thumb–index pinch, the way Ultraleap measures it: the closest gap between the
// last bones of the thumb (3–4) and index finger (6–7, 7–8), so finger pads
// touching reads ~0 even though the tip landmarks sit a little apart.
// `p` = landmarks in pixel units. Scale = average of four palm bones, which is
// steadier than any single bone and cancels camera distance.
function measurePinch(p) {
  const gap = Math.min(
    segmentDistance(p[3], p[4], p[6], p[7]),
    segmentDistance(p[3], p[4], p[7], p[8]),
  );
  const palm = (dist3(p[0], p[5]) + dist3(p[0], p[9]) + dist3(p[0], p[17]) + dist3(p[5], p[17])) / 4;
  return gap / palm;
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const sub3 = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
function angleDeg(u, v) {
  const dot = u.x * v.x + u.y * v.y + u.z * v.z;
  const len = Math.hypot(u.x, u.y, u.z) * Math.hypot(v.x, v.y, v.z) || 1;
  return (Math.acos(Math.min(1, Math.max(-1, dot / len))) * 180) / Math.PI;
}

// ---- Hand analysis ---------------------------------------------------------
// Finger is extended when its segments line up (small total bend). Uses 3D
// world landmarks, so it works whether the palm faces the camera or not.
function fingerExtended(w, [mcp, pip, dip, tip]) {
  const bend = angleDeg(sub3(w[pip], w[mcp]), sub3(w[dip], w[pip])) +
               angleDeg(sub3(w[tip], w[dip]), sub3(w[dip], w[pip]));
  return bend < FINGER_STRAIGHT_DEG;
}
// Thumb is "out" when its tip is well away from the index knuckle.
const thumbExtended = (w, palm) => dist3(w[THUMB_TIP], w[INDEX_MCP]) / palm > 0.55;

function classifyPose(ext, lms) {
  const [t, i, m, r, p] = ext;
  const fingers = [i, m, r, p].filter(Boolean).length;
  if (fingers === 0) {
    // Thumb up: thumb out and its tip clearly above the wrist on screen
    if (t && lms[THUMB_TIP].y < lms[WRIST].y - 0.08) return "👍 thumbs up";
    return "✊ fist";
  }
  if (fingers === 4) return "✋ open";
  if (i && !m && !r && !p) return "☝️ point";
  if (i && m && !r && !p) return "✌️ peace";
  if (i && !m && !r && p) return "🤘 horns";
  return `${fingers + (t ? 1 : 0)} fingers`;
}

// Assign detections to left/right. In the mirrored view, the hand on the left
// of the screen is the user's left hand. With one hand visible, stick with the
// side it was on last frame so it doesn't flip when crossing the middle.
function assignSides(result, now) {
  const dets = result.landmarks.map((lms, i) => ({
    lms,
    world: result.worldLandmarks[i],
    x: 1 - lms[WRIST].x,
  }));
  dets.sort((a, b) => a.x - b.x);

  if (dets.length >= 2) return { left: dets[0], right: dets[dets.length - 1] };
  if (dets.length === 0) return {};

  const d = dets[0];
  const recent = (s) => s.hand && now - s.lastSeen < HOLD_MS;
  const gap = (s) => Math.abs(s.hand.wristX - d.x);
  if (recent(sides.left) && recent(sides.right)) {
    return gap(sides.left) <= gap(sides.right) ? { left: d } : { right: d };
  }
  if (recent(sides.left)) return { left: d };
  if (recent(sides.right)) return { right: d };
  return d.x < 0.5 ? { left: d } : { right: d };
}

function processHand(side, det, now) {
  const s = sides[side];
  if (now - s.lastSeen > HOLD_MS) resetSide(s);
  const w = det.world;
  const palm = dist3(w[WRIST], w[MIDDLE_MCP]);

  // Smoothed landmark positions in mirrored canvas pixels (for drawing)
  const pts = det.lms.map((p, i) => ({
    x: s.points[i].x.filter(1 - p.x, now) * canvas.width,
    y: s.points[i].y.filter(p.y, now) * canvas.height,
  }));

  // Pinch (thumb ↔ index): median over recent frames removes one-frame tracking
  // glitches, then a stronger One Euro filter removes tremor.
  // Image landmarks → pixels (x, y and MediaPipe's relative depth z, which is on x's scale)
  const px = det.lms.map((q) => ({ x: q.x * canvas.width, y: q.y * canvas.height, z: q.z * canvas.width }));
  const pinchRaw = measurePinch(px);
  s.pinchRecent.push(pinchRaw);
  if (s.pinchRecent.length > PINCH_MEDIAN_FRAMES) s.pinchRecent.shift();
  const pinch = clamp01(s.pinch.filter(remap(median(s.pinchRecent), PINCH_CLOSED, PINCH_OPEN), now));
  if (!s.pinched && pinch < PINCH_ON) s.pinched = true;
  else if (s.pinched && pinch > PINCH_OFF) s.pinched = false;

  // Height from palm center
  const palmY = PALM.reduce((sum, i) => sum + det.lms[i].y, 0) / PALM.length;
  const height = clamp01(s.height.filter(remap(palmY, HEIGHT_BOTTOM, HEIGHT_TOP), now));

  // Openness: how far fingertips reach from the wrist
  const reach = FINGER_NAMES.reduce((sum, f) => sum + dist3(w[FINGERS[f][3]], w[WRIST]), 0) / 4 / palm;
  const open = clamp01(s.open.filter(remap(reach, OPEN_FIST, OPEN_FLAT), now));

  // Finger states + pose (debounced so it doesn't flicker)
  const ext = [thumbExtended(w, palm), ...FINGER_NAMES.map((f) => fingerExtended(w, FINGERS[f]))];
  const candidate = classifyPose(ext, det.lms);
  if (candidate === s.poseCandidate) s.poseFrames++;
  else { s.poseCandidate = candidate; s.poseFrames = 1; }
  if (s.poseFrames >= POSE_STABLE_FRAMES) s.pose = candidate;

  s.lastSeen = now;
  s.hand = {
    pts,
    thumb: pts[THUMB_TIP],
    index: pts[INDEX_TIP],
    mid: mid(pts[THUMB_TIP], pts[INDEX_TIP]),
    wristX: det.x,
    pinchRaw, pinch, pinched: s.pinched,
    // Palm size in pixels, the scale the pinch is measured against (djGame.js sizes its targets with it).
    palmPx: (dist3(px[0], px[5]) + dist3(px[0], px[9]) + dist3(px[0], px[17]) + dist3(px[5], px[17])) / 4,
    height, open, ext,
    pose: s.pose,
  };
  if (calib) calib.samples.push(pinchRaw);
}

function update(result, now) {
  const assigned = assignSides(result, now);
  for (const side of ["left", "right"]) {
    if (assigned[side]) processHand(side, assigned[side], now);
  }
  const live = (side) => (now - sides[side].lastSeen < HOLD_MS ? sides[side].hand : null);
  const left = live("left"), right = live("right");
  djGame.update({ left, right }, now); // the set as a rhythm game: your hands do the mixes (djGame.js)

  let between = null;
  if (left && right) {
    const raw = dist2(left.mid, right.mid) / canvas.width;
    between = { raw, value: clamp01(betweenFilter.filter(remap(raw, BETWEEN_CLOSED, BETWEEN_OPEN), now)) };
  } else {
    betweenFilter.reset();
  }

  // Hands drive the audio. A missing hand leaves its control where it was.
  if (left) knobs.left = stabilize(knobs.left, left.pinch);
  if (right) knobs.right = stabilize(knobs.right, right.pinch);
  const speed = SPEED_MIN + knobs.left * (SPEED_MAX - SPEED_MIN);
  controls.speed = Math.abs(speed - 1) < SPEED_DETENT ? 1 : speed;
  controls.freq = knobs.right === 1 ? FREQ_OFF : FREQ_MIN * Math.pow(FREQ_MAX / FREQ_MIN, knobs.right);
  if (between) controls.volume = deadband(controls.volume, between.value, DEADBAND / 2);
  deck.setSpeed(controls.speed);
  deck.setFrequency(controls.freq);
  deck.setVolume(controls.volume);
  updateControls();

  draw(left, right, between);
  updatePanel("left", left);
  updatePanel("right", right);
  updateBetween(between);
}

// ---- Knobs (pinch → control value) ---------------------------------------------
// Deadband absorbs leftover wobble; end snapping makes fully closed / fully open
// easy to hit and hold.
function stabilize(current, pinch) {
  const v = deadband(current, pinch, DEADBAND);
  if (v < END_SNAP) return 0;
  if (v > 1 - END_SNAP) return 1;
  return v;
}

// Output follows the input only once it moves more than `db` away, which
// absorbs small wobble. Input is stretched slightly so 0 and 1 are still reachable.
function deadband(current, target, db) {
  const t = -db + target * (1 + 2 * db);
  if (t > current + db) return clamp01(t - db);
  if (t < current - db) return clamp01(t + db);
  return current;
}

// ---- Calibration -------------------------------------------------------------
// Two 2-second phases: pinch both hands, then open wide. Uses the medians.
let calib = null;
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function calibrate() {
  calibBtn.disabled = true;
  const phase = async (msg) => {
    for (let n = 3; n > 0; n--) { calibMsg.textContent = `${msg} in ${n}…`; await wait(700); }
    calibMsg.textContent = `${msg}: hold it…`;
    calib = { samples: [] };
    await wait(2000);
    const samples = calib.samples;
    calib = null;
    return samples;
  };
  const closed = await phase("Pinch thumb + index on both hands");
  const open = await phase("Spread thumb + index wide");
  if (closed.length < 10 || open.length < 10 || median(closed) >= median(open)) {
    calibMsg.textContent = "Calibration failed (hands not seen). Try again.";
  } else {
    // Small margins so a real pinch reaches 0 and a comfortable spread reaches 1
    PINCH_CLOSED = median(closed) + 0.03;
    PINCH_OPEN = median(open) * 0.9;
    try { localStorage.setItem("airdeck-pinch-v2", JSON.stringify({ closed: PINCH_CLOSED, open: PINCH_OPEN })); } catch {}
    calibMsg.textContent = `Calibrated: closed ${PINCH_CLOSED.toFixed(2)}, open ${PINCH_OPEN.toFixed(2)}`;
  }
  calibBtn.disabled = false;
}

// ---- Drawing -------------------------------------------------------------------
function draw(left, right, between) {
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  if (left) drawHand(left, COLORS.left);
  if (right) drawHand(right, COLORS.right);
  drawKnobMeter("left", 24, COLORS.left, `speed ${controls.speed.toFixed(2)}×`);
  drawKnobMeter("right", canvas.width - 40, COLORS.right, `filter ${formatHz(controls.freq)}`);

  if (between) {
    drawWaveform(left.mid, right.mid);
    const m = mid(left.mid, right.mid);
    drawLabel({ x: m.x, y: m.y - WAVE_AMPLITUDE / 2 - 30 }, `vol ${Math.round(controls.volume * 100)}%`, COLORS.between);
  }
}

// The line between the hands is the live audio waveform, bent along the line.
// It's flat when nothing is playing and grows with the volume.
function drawWaveform(a, b) {
  const data = deck.waveform();
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len; // unit normal to the line
  const POINTS = 160;
  ctx.save();
  ctx.strokeStyle = COLORS.between;
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.shadowColor = COLORS.between;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  for (let i = 0; i <= POINTS; i++) {
    const t = i / POINTS;
    const sample = data ? data[Math.floor(t * (data.length - 1))] : 0;
    // Taper to zero at both ends so the wave stays pinned to the fingertips
    const off = sample * WAVE_AMPLITUDE * Math.sin(Math.PI * t);
    const x = a.x + dx * t + nx * off;
    const y = a.y + dy * t + ny * off;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawHand(hand, color) {
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  for (const [a, b] of CONNECTIONS) {
    ctx.beginPath();
    ctx.moveTo(hand.pts[a].x, hand.pts[a].y);
    ctx.lineTo(hand.pts[b].x, hand.pts[b].y);
    ctx.stroke();
  }
  ctx.fillStyle = "#fff";
  for (const p of hand.pts) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  // Extended fingertips get a colored ring
  [THUMB_TIP, ...FINGER_NAMES.map((f) => FINGERS[f][3])].forEach((tip, i) => {
    if (!hand.ext[i]) return;
    ctx.beginPath();
    ctx.arc(hand.pts[tip].x, hand.pts[tip].y, 7, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // Thumb ↔ index line, thicker when pinched
  drawLine(hand.thumb, hand.index, color, hand.pinched ? 8 : 4);
  for (const p of [hand.thumb, hand.index]) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  drawLabel({ x: hand.mid.x, y: hand.mid.y - 28 }, hand.pinch.toFixed(2) + (hand.pinched ? " ✓" : ""), color);

  // Pose label under the wrist
  drawLabel({ x: hand.pts[WRIST].x, y: hand.pts[WRIST].y + 40 }, hand.pose, "#fff");
}

// Vertical meter at the screen edge showing a hand's control value.
function drawKnobMeter(side, x, color, label) {
  const top = canvas.height * 0.15, bottom = canvas.height * 0.85;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.roundRect(x, top, 16, bottom - top, 8);
  ctx.fill();
  const y = bottom - knobs[side] * (bottom - top);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, 16, bottom - y, 8);
  ctx.fill();
  const labelX = side === "left" ? x + 100 : x + 16 - 100;
  drawLabel({ x: labelX, y: top - 24 }, label, color);
}

function drawLine(a, b, color, width, dash = []) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}

function drawLabel(at, text, color) {
  ctx.save();
  ctx.font = "600 22px system-ui, sans-serif";
  const w = ctx.measureText(text).width + 20, h = 32;
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.beginPath();
  ctx.roundRect(at.x - w / 2, at.y - h / 2, w, h, 8);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, at.x, at.y + 1);
  ctx.restore();
}

// ---- Panel updates ---------------------------------------------------------------
function setRow(id, value) {
  $(id + "Val").textContent = value === null ? "–" : value.toFixed(2);
  $(id + "Bar").style.width = (value ?? 0) * 100 + "%";
}

function updatePanel(side, hand) {
  setRow(side + "Pinch", hand ? hand.pinch : null);
  setRow(side + "Height", hand ? hand.height : null);
  setRow(side + "Open", hand ? hand.open : null);
  $(side + "Pose").textContent = hand ? hand.pose : "not detected";
  for (let i = 0; i < 5; i++) $(side + "F" + i).classList.toggle("on", !!hand && hand.ext[i]);}

const formatHz = (hz) => (hz >= 1000 ? (hz / 1000).toFixed(1) + " kHz" : Math.round(hz) + " Hz");

function updateControls() {
  $("leftControl").textContent = controls.speed.toFixed(2) + "×";
  $("rightControl").textContent = formatHz(controls.freq);
  $("volumeControl").textContent = Math.round(controls.volume * 100) + "%";
}

function updateBetween(between) {
  setRow("between", between ? between.value : null);
  $("betweenSub").textContent = between ? `raw ${between.raw.toFixed(2)}` : "needs both hands";
}

function updateFps(now) {
  frames++;
  if (now - fpsTime >= 1000) {
    statusEl.textContent = `${frames} fps`;
    frames = 0;
    fpsTime = now;
  }
}

// ---- The set -------------------------------------------------------------------------
// You pick the set on the start screen (djStart.js); the queue (queue.js) plays exactly
// those songs, and the game (djGame.js) is how you mix them.
const songStatus = $("songStatus");
const queue = createQueue(deck);

// The set as a rhythm game over the camera view, plus its card in the rail (djGame.js).
const stage = document.querySelector(".stage");
const djGame = createDjGame(queue, {
  stage,
  camera: canvas,
  rail: $("djSet"),
  deck,
  startEnabled: false,
  // The pinch calibration and control ranges, so the game's targets mean real sounds.
  controlMap: () => ({
    pinchClosed: PINCH_CLOSED,
    pinchOpen: PINCH_OPEN,
    freqMin: FREQ_MIN,
    freqMax: FREQ_MAX,
    betweenClosed: BETWEEN_CLOSED,
    betweenOpen: BETWEEN_OPEN,
  }),
  onSetEnd: (results) => {
    screens.results(results);
    queue.say(`That's the set! ${Math.round(results.accuracy * 100)} percent, best combo ${results.best}. Make some noise!`);
  },
});

// The screens: pick your set, how to play and the camera (first time), 3-2-1, results.
const screens = createStartScreen(stage, {
  library: async () => {
    await queue.libraryReady();
    return queue.getState().library;
  },
  startCamera: async () => {
    deck.ensureContext(); // inside a click, so the browser allows sound
    try {
      await modelReady;
    } catch {
      return false; // the hand tracking model didn't load
    }
    return video.srcObject ? true : startCamera();
  },
  handSeen: (side) => performance.now() - sides[side].lastSeen < 300,
  prepare: async (ids) => {
    deck.ensureContext(); // the Play click
    djGame.reset();
    await queue.playSet(ids);
    await queue.readyToStart();
  },
  begin: () => {
    djGame.setEnabled(true);
    queue.beginSet();
  },
});

// Keep the song card's status line in step with the queue.
function updateSongCard() {
  const { items, downloads, status, dj } = queue.getState();
  const active = downloads.filter((download) => download.stage !== "failed");
  const idle = items.length ? "" : "Pick your songs to start.";
  songStatus.textContent =
    status?.message ??
    (dj.talking ? "🎙 On the mic…" : active.length ? `Downloading ${active.length} song${active.length > 1 ? "s" : ""}…` : idle);
  songStatus.classList.toggle("error", Boolean(status?.isError));
}
queue.on(updateSongCard);

startBtn.addEventListener("click", startCamera);
calibBtn.addEventListener("click", calibrate);
updateControls();

const modelReady = loadModel();
modelReady
  .then(() => {
    startBtn.disabled = false;
    startBtn.textContent = "Start camera";
  })
  .catch((err) => {
    startBtn.textContent = "Model failed";
    statusEl.textContent = err.message;
  });
</script>
</body>
